<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JS Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        #first-head {
            margin-bottom: 1rem;
        }

        body {
            background: #f9faf5;
        }

        .section-card {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark-subtle px-3">
        <a class="navbar-brand text-dark fw-bold fs-3">Contact Form</a>

        <input type="text" id="search" class="form-control w-25" placeholder="Search contact..."
            onkeyup="searchContact()">
    </nav>

    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col col-sm-8">
                <div class="section-card">
                    <h4 id="first-head">Add New Contact</h4>
                    <h6 class="text-muted">Enter your details</h6>

                    <form action="">
                        <input type="text" id="name" class="form-control mt-2" placeholder="Enter Name">
                        <input type="text" id="phone" class="form-control mt-2" placeholder="Enter Number">
                    </form>

                    <button class="btn btn-primary mt-3" onclick="addContact()">Save Contact</button>
                </div>
            </div>

            <div class="col col-sm-8">
                <div class="section-card">
                    <ul class="list-group mt-3" id="contactList"></ul>
                </div>
            </div>
        </div>

    </div>


    <script src="Mycontact.js"></script>
</body>

</html>
